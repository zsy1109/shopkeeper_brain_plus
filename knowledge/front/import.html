<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掌柜智库·增强版 · 文件导入</title>
    <style>
        :root{
            --bg-0:#0a0f1e;
            --bg-1:#0f172a;
            --panel:rgba(22, 33, 56, 0.65);
            --text:#e2e8f0;
            --muted:#94a3b8;
            --dim:#64748b;
            --brand:#38bdf8;
            --brand-2:#818cf8;
            --brand-3:#f472b6;
            --success:#10b981;
            --warning:#f59e0b;
            --error:#ef4444;
            --border:rgba(148, 163, 184, 0.12);
            --border-strong:rgba(148, 163, 184, 0.22);
            --shadow-lg:0 25px 50px -12px rgba(0, 0, 0, 0.6);
            --radius-lg:16px;
            --radius-md:12px;
            --radius-sm:8px;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{min-height:100%}
        body {
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, Arial, sans-serif;
            margin: 0;
            padding: 24px 20px;
            display: flex;
            justify-content: center;
            background: var(--bg-0);
            color:var(--text);
            min-height:100vh;
            position:relative;
        }
        body::before{
            content:'';position:fixed;inset:0;z-index:0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56,189,248,0.12), transparent),
                radial-gradient(circle at 15% 20%, rgba(129,140,248,0.10), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(244,114,182,0.08), transparent 40%),
                linear-gradient(to bottom, var(--bg-0), var(--bg-1));
        }
        body::after{
            content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
            background-image:
                linear-gradient(to right, rgba(148,163,184,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148,163,184,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 100%);
        }

        .app{
            position:relative;z-index:1;
            width:100%;
            max-width:860px;
            background:var(--panel);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.05);
            overflow:hidden;
        }
        .app::before{
            content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;
            background:linear-gradient(90deg, transparent, rgba(56,189,248,0.6), rgba(129,140,248,0.6), transparent);
        }

        .topbar{
            display:flex;align-items:center;gap:14px;
            padding:18px 24px;
            border-bottom:1px solid var(--border);
            background:linear-gradient(180deg, rgba(15,23,42,0.7), rgba(15,23,42,0.3));
        }
        .logo{
            width:42px;height:42px;border-radius:12px;flex-shrink:0;
            background:linear-gradient(135deg, var(--brand), var(--brand-2) 60%, var(--brand-3));
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 0 24px rgba(56,189,248,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .logo svg{width:22px;height:22px;color:#fff}
        .title{display:flex;flex-direction:column;line-height:1.2}
        .title h1{
            font-size:16px;font-weight:700;letter-spacing:0.5px;
            background:linear-gradient(90deg, #f1f5f9, #cbd5e1);
            -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        .title span{font-size:12px;color:var(--muted);margin-top:4px}

        .nav-tabs{display:flex;gap:4px;margin-left:auto;padding:4px;border-radius:var(--radius-md);background:rgba(15,23,42,0.5);border:1px solid var(--border)}
        .nav-tab{
            display:flex;align-items:center;gap:6px;
            padding:6px 14px;border-radius:var(--radius-sm);
            font-size:13px;color:var(--muted);cursor:pointer;user-select:none;
            transition:all 0.2s;text-decoration:none;border:none;background:transparent;
        }
        .nav-tab:hover{color:var(--text);background:rgba(148,163,184,0.08)}
        .nav-tab.active{
            color:#fff;
            background:linear-gradient(135deg, rgba(56,189,248,0.25), rgba(129,140,248,0.25));
            box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .nav-tab svg{width:14px;height:14px}

        .main{padding:28px 24px}

        .upload-area {
            border:2px dashed rgba(56, 189, 248, 0.3);
            background:
                radial-gradient(ellipse 60% 40% at 50% 50%, rgba(56,189,248,0.06), transparent),
                rgba(15, 23, 42, 0.35);
            border-radius: var(--radius-md);
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .upload-area::before{
            content:'';position:absolute;inset:-2px;border-radius:calc(var(--radius-md) + 2px);
            background:conic-gradient(from 0deg, transparent, rgba(56,189,248,0.3), transparent 30%);
            animation:rotate-border 6s linear infinite;
            z-index:-1;opacity:0;transition:opacity 0.3s;
        }
        .upload-area:hover::before{opacity:1}
        @keyframes rotate-border{
            to{transform:rotate(360deg)}
        }
        .upload-area:hover {
            border-color: rgba(56, 189, 248, 0.7);
            background:
                radial-gradient(ellipse 60% 40% at 50% 50%, rgba(56,189,248,0.1), transparent),
                rgba(15, 23, 42, 0.5);
            box-shadow: inset 0 0 32px rgba(56, 189, 248, 0.08);
            transform: translateY(-1px);
        }
        .upload-area.dragover {
            border-color: var(--brand);
            background: rgba(56, 189, 248, 0.12);
            transform: scale(1.01);
        }
        .upload-area.dragover::before{opacity:1;animation-duration:2s}

        .upload-icon {
            width:64px;height:64px;border-radius:50%;
            margin:0 auto 18px;
            background:linear-gradient(135deg, rgba(56,189,248,0.2), rgba(129,140,248,0.2));
            border:1px solid rgba(56,189,248,0.3);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 0 24px rgba(56,189,248,0.2);
            transition:transform 0.3s;
        }
        .upload-area:hover .upload-icon{transform:scale(1.08) translateY(-2px)}
        .upload-icon svg{width:28px;height:28px;color:var(--brand)}

        .upload-text {
            color: var(--muted);
            font-size: 15px;
            font-weight:500;
            margin-bottom:6px;
        }
        .upload-hint{color:var(--dim);font-size:12px}

        .file-input { display: none; }

        .supported-types{
            margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
        }
        .type-tag{
            font-size:11px;padding:3px 10px;border-radius:999px;
            background:rgba(15,23,42,0.5);border:1px solid var(--border);
            color:var(--dim);
        }
        .type-tag strong{color:var(--brand-2)}

        .section-title{
            display:flex;align-items:center;gap:8px;
            font-size:13px;color:var(--muted);font-weight:500;
            margin-bottom:14px;
        }
        .section-title::before{
            content:'';width:3px;height:14px;border-radius:2px;
            background:linear-gradient(180deg, var(--brand), var(--brand-2));
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .file-list:empty{
            text-align:center;padding:30px 0;
            color:var(--dim);font-size:13px;
        }

        .file-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            display: flex;
            gap: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
            animation:slide-in 0.3s ease-out;
        }
        @keyframes slide-in{
            from{opacity:0;transform:translateY(8px)}
            to{opacity:1;transform:translateY(0)}
        }
        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.4);
            border-color: rgba(56, 189, 248, 0.25);
        }

        .file-icon{
            width:44px;height:44px;border-radius:var(--radius-sm);flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            font-size:11px;font-weight:700;color:#fff;letter-spacing:0.5px;
            position:relative;overflow:hidden;
        }
        .file-icon::before{
            content:'';position:absolute;inset:0;
            background:linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
        }
        .file-icon.pdf{background:linear-gradient(135deg, #ef4444, #dc2626);box-shadow:0 4px 14px rgba(239,68,68,0.3)}
        .file-icon.md{background:linear-gradient(135deg, #10b981, #059669);box-shadow:0 4px 14px rgba(16,185,129,0.3)}
        .file-icon.other{background:linear-gradient(135deg, #6366f1, #4f46e5);box-shadow:0 4px 14px rgba(99,102,241,0.3)}
        .file-icon span{position:relative;z-index:1}

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width:0;
        }
        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap:12px;
            margin-bottom: 10px;
        }
        .file-name {
            font-weight: 600;
            color: #f1f5f9;
            font-size: 14px;
            word-break: break-all;
            line-height:1.4;
        }
        .file-size {
            font-size: 12px;
            color: var(--dim);
            white-space:nowrap;flex-shrink:0;
            margin-top:2px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            min-width:72px;
            text-align: center;
            letter-spacing: 0.5px;
            flex-shrink:0;
        }
        .status-uploading { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow:0 2px 8px rgba(245,158,11,0.3) }
        .status-processing { background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow:0 2px 8px rgba(56,189,248,0.3) }
        .status-completed { background: linear-gradient(135deg, #10b981, #059669); box-shadow:0 2px 8px rgba(16,185,129,0.3) }
        .status-error { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow:0 2px 8px rgba(239,68,68,0.3) }

        .progress-wrapper { margin-top: 4px; display: none; }
        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s;
            position: relative;
            overflow: hidden;
        }
        .progress-bar::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .progress-text {
            font-size: 11px;
            color: var(--muted);
            margin-top: 5px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .log-details {
            margin-top: 10px;
            font-size: 13px;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.4);
            border-radius: var(--radius-sm);
            padding: 0;
            border: 1px solid var(--border);
            overflow:hidden;
        }
        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: var(--muted);
            padding: 10px 14px;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.3px;
            outline: none;
            display:flex;align-items:center;gap:8px;
            transition: color 0.2s, background 0.2s;
        }
        .log-details summary::before{
            content:'';width:6px;height:6px;border-radius:50%;
            background:var(--dim);
        }
        .log-details[open] summary{border-bottom:1px solid var(--border);color:var(--text);background:rgba(15,23,42,0.3)}
        .log-details[open] summary::before{background:var(--brand);animation:pulse-dot 1.5s infinite}
        @keyframes pulse-dot{
            0%,100%{opacity:1;transform:scale(1)}
            50%{opacity:0.5;transform:scale(0.85)}
        }
        .log-details summary:hover { color: var(--text); }

        .log-list {
            margin: 0;
            padding: 6px 0;
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            position: relative;
        }
        .log-list::-webkit-scrollbar{width:5px}
        .log-list::-webkit-scrollbar-track{background:transparent}
        .log-list::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.15);border-radius:3px}
        .log-list::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.3)}

        .log-list li {
            margin: 0;
            padding: 8px 16px 8px 30px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            position: relative;
            font-size:12px;
            transition: background 0.2s;
        }
        .log-list li:hover { background: rgba(255, 255, 255, 0.03); }

        .log-list li::before {
            content: "";
            position: absolute;
            left: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid #334155;
            background: #1e293b;
            z-index: 1;
        }
        .log-list li::after{
            content:'';position:absolute;left:13px;top:0;bottom:0;width:1px;
            background:rgba(148,163,184,0.1);z-index:0;
        }
        .log-list li:last-child::after{display:none}

        .log-done { color: #d1fae5; }
        .log-done::before {
            background: #10b981 !important;
            border-color: #10b981 !important;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
        }

        .log-running { color: #bae6fd; }
        .log-running::before {
            background: #3b82f6 !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
            animation: pulse-dot 1.2s infinite !important;
        }

        .log-duration {
            margin-left: auto;
            font-size: 11px;
            color: #67e8f9;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 2px 10px;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        @media (max-width:640px){
            body{padding:12px}
            .main{padding:20px 16px}
            .upload-area{padding:36px 16px}
            .upload-icon{width:52px;height:52px}
            .upload-icon svg{width:22px;height:22px}
            .file-item{flex-wrap:wrap}
            .file-header{width:100%}
            .file-icon{width:36px;height:36px;font-size:9px}
        }
    </style>
</head>
<body>

<div class="app">
    <div class="topbar">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="18" x2="12" y2="12"/>
                <polyline points="9 15 12 12 15 15"/>
            </svg>
        </div>
        <div class="title">
            <h1>掌柜智库·增强版</h1>
            <span>文件导入 · 上传 PDF 或 Markdown 文档，自动解析入库</span>
        </div>
        <div class="nav-tabs">
            <a class="nav-tab active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                导入
            </a>
            <a class="nav-tab" href="manage.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                管理
            </a>
            <a class="nav-tab" href="chat.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                聊天
            </a>
        </div>
    </div>

    <div class="main">
        <div class="upload-area" id="dropZone">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <div class="upload-text">点击或拖拽文件到此处上传</div>
            <div class="upload-hint">支持批量上传，文件将自动解析、切片并入库</div>
            <div class="supported-types">
                <span class="type-tag"><strong>.pdf</strong> 文档</span>
                <span class="type-tag"><strong>.md</strong> 文档</span>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".pdf,.md" multiple>
        </div>

        <div class="section-title" id="listTitle" style="display:none">上传列表</div>
        <div id="fileList" class="file-list"></div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const listTitle = document.getElementById('listTitle');

    const API_BASE = (location.port === '8000' || location.hostname === 'localhost')
      ? `${location.protocol}//${location.hostname}:8000`
      : 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('click', () => {
        fileInput.click();
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
        listTitle.style.display = 'flex';
    }

    function getFileIconClass(filename){
        const ext = filename.toLowerCase();
        if(ext.endsWith('.pdf')) return 'pdf';
        if(ext.endsWith('.md')) return 'md';
        return 'other';
    }
    function getFileExtLabel(filename){
        const ext = filename.split('.').pop();
        return (ext || 'FILE').toUpperCase();
    }

    function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector('.progress-bar');
        const text = wrapper.querySelector('.progress-text');

        const safePercentage = Math.min(Math.max(percentage, 0), 100);

        bar.style.width = safePercentage + '%';
        text.textContent = Math.round(safePercentage) + '%';

        if (safePercentage >= 100) {
            bar.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
        } else if (safePercentage < 10) {
            bar.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
        } else {
            bar.style.background = 'linear-gradient(90deg, var(--brand), var(--brand-2))';
        }
    }

    async function uploadFile(file) {
        const isPDF = file.name.toLowerCase().endsWith('.pdf');
        const totalNodes = isPDF ? 8 : 7;

        const id = 'file-' + Math.random().toString(36).substr(2, 8);
        const iconClass = getFileIconClass(file.name);
        const extLabel = getFileExtLabel(file.name);

        const html = `
            <div class="file-item" id="${id}">
                <div class="file-icon ${iconClass}"><span>${extLabel}</span></div>
                <div class="file-info">
                    <div class="file-header">
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${(file.size / 1024).toFixed(2)} KB</div>
                        </div>
                        <div class="status-badge status-uploading">上传中</div>
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="progress-text">0%</div>
                    </div>
                    <details class="log-details" open>
                        <summary>准备上传...</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logListEl = itemEl.querySelector('.log-list');

        const formData = new FormData();
        formData.append('file', file);

        try {
            progressWrapper.style.display = 'block';

            const uploadPercentage = (1 / totalNodes) * 100;
            updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

            const initialLog = document.createElement('li');
            initialLog.textContent = "开始上传文件...";
            initialLog.className = "log-running";
            logListEl.appendChild(initialLog);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');

            const result = await response.json();
            const taskId = result.task_id;

            updateProgressUI(progressWrapper, uploadPercentage);
            statusBadge.textContent = '处理中';
            statusBadge.className = 'status-badge status-processing';

            pollStatus(taskId, itemEl, totalNodes);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '上传失败';
            statusBadge.className = 'status-badge status-error';
            updateProgressUI(progressWrapper, 0);

            const errLog = document.createElement('li');
            errLog.textContent = "❌ 网络请求失败或服务器异常";
            errLog.style.color = "#fca5a5";
            logListEl.appendChild(errLog);
        }
    }

    function normalizeLogText(text) {
        if (typeof text !== 'string') return String(text);
        return text;
    }

    function formatDuration(seconds) {
        if (seconds < 60) {
            return seconds.toFixed(1) + 's';
        }
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(0);
        return `${mins}m${secs}s`;
    }

    function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const durationMap = durations || {};

        let currentPercentage = (done.length / totalNodes) * 100;

        if (running.length > 0) {
            currentPercentage += (0.5 / totalNodes) * 100;
        }

        if (currentPercentage >= 100) {
            currentPercentage = 95;
        }

        let totalDuration = 0;
        for (const key in durationMap) {
            totalDuration += durationMap[key];
        }
        const totalDurationText = totalDuration > 0 ? ` · 总耗时 ${formatDuration(totalDuration)}` : '';

        logSummary.textContent = `运行日志 · ${done.length} 完成 / ${running.length} 进行中${totalDurationText}`;

        logListEl.innerHTML = '';

        for (const item of done) {
            if (item === 'upload_file') continue;

            const li = document.createElement('li');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = `${normalizeLogText(item)}`;
            li.appendChild(nameSpan);

            if (durationMap[item] !== undefined) {
                const durationSpan = document.createElement('span');
                durationSpan.className = 'log-duration';
                durationSpan.textContent = formatDuration(durationMap[item]);
                li.appendChild(durationSpan);
            }

            li.className = 'log-done';
            logListEl.appendChild(li);
        }

        for (const item of running) {
            const li = document.createElement('li');
            li.textContent = `正在处理 ${normalizeLogText(item)}...`;
            li.className = 'log-running';
            logListEl.appendChild(li);
        }

        logListEl.scrollTop = logListEl.scrollHeight;

        return currentPercentage;
    }

    function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logDetails = itemEl.querySelector('.log-details');
        let stopped = false;

        const interval = setInterval(async () => {
            if (stopped) return;

            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                if (!res.ok) throw new Error('Status request failed');

                const data = await res.json();

                if (stopped) return;

                const calculatedPercentage = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes, data.durations);

                if (data.status === 'completed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressUI(progressWrapper, 100);

                    setTimeout(() => {
                        logDetails.open = false;
                    }, 1000);

                } else if (data.status === 'failed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';

                    const logListEl = itemEl.querySelector('.log-list');
                    const errLog = document.createElement('li');
                    errLog.textContent = "❌ 工作流执行失败中止";
                    errLog.style.color = "#fca5a5";
                    logListEl.appendChild(errLog);

                } else if (data.status === 'processing') {
                    updateProgressUI(progressWrapper, calculatedPercentage);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 1500);
    }
</script>

</body>
