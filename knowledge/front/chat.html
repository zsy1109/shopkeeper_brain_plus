<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>掌柜智库·增强版 · 智能问答</title>
  <style>
    :root{
      --bg-0:#0a0f1e;
      --bg-1:#0f172a;
      --panel:rgba(22, 33, 56, 0.65);
      --panel-solid:#162138;
      --text:#e2e8f0;
      --muted:#94a3b8;
      --dim:#64748b;
      --brand:#38bdf8;
      --brand-2:#818cf8;
      --brand-3:#f472b6;
      --success:#10b981;
      --border:rgba(148, 163, 184, 0.12);
      --border-strong:rgba(148, 163, 184, 0.22);
      --glow:0 0 24px rgba(56, 189, 248, 0.15);
      --glow-strong:0 0 40px rgba(56, 189, 248, 0.25);
      --shadow-lg:0 25px 50px -12px rgba(0, 0, 0, 0.6);
      --radius-lg:16px;
      --radius-md:12px;
      --radius-sm:8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, Arial, sans-serif;
      background:var(--bg-0);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      position:relative;
    }
    body::before{
      content:'';
      position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56,189,248,0.12), transparent),
        radial-gradient(circle at 15% 20%, rgba(129,140,248,0.10), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(244,114,182,0.08), transparent 40%),
        linear-gradient(to bottom, var(--bg-0), var(--bg-1));
    }
    body::after{
      content:'';
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:
        linear-gradient(to right, rgba(148,163,184,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148,163,184,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 100%);
    }

    .app{
      position:relative;z-index:1;
      width:100%;
      max-width:1060px;
      height:min(860px, 94vh);
      background:var(--panel);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.05);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .app::before{
      content:'';
      position:absolute;top:-1px;left:20%;right:20%;height:1px;
      background:linear-gradient(90deg, transparent, rgba(56,189,248,0.6), rgba(129,140,248,0.6), transparent);
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:16px;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(15,23,42,0.7), rgba(15,23,42,0.3));
    }
    .brand{
      display:flex;align-items:center;gap:12px;min-width:0;
    }
    .logo{
      width:40px;height:40px;border-radius:12px;flex-shrink:0;
      background:linear-gradient(135deg, var(--brand), var(--brand-2) 60%, var(--brand-3));
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 24px rgba(56,189,248,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
      position:relative;
    }
    .logo::after{
      content:'';position:absolute;inset:2px;border-radius:10px;
      background:linear-gradient(135deg, rgba(255,255,255,0.15), transparent 40%);
    }
    .logo svg{width:22px;height:22px;color:#fff;position:relative;z-index:1}
    .title{display:flex;flex-direction:column;line-height:1.1;min-width:0}
    .title strong{
      font-size:15px;font-weight:700;letter-spacing:0.5px;
      background:linear-gradient(90deg, #f1f5f9, #cbd5e1);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .title span{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
    .title span .dot-live{
      width:6px;height:6px;border-radius:50%;background:var(--success);
      box-shadow:0 0 8px rgba(16,185,129,0.6);
      animation:pulse-dot 2s infinite;
    }
    @keyframes pulse-dot{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.5;transform:scale(0.85)}
    }

    .nav-tabs{display:flex;gap:4px;margin:0 auto;padding:4px;border-radius:10px;background:rgba(15,23,42,0.5);border:1px solid var(--border)}
    .nav-tab{
      display:flex;align-items:center;gap:6px;
      padding:5px 12px;border-radius:8px;
      font-size:12px;color:var(--muted);cursor:pointer;user-select:none;
      transition:all 0.2s;text-decoration:none;border:none;background:transparent;
    }
    .nav-tab:hover{color:var(--text);background:rgba(148,163,184,0.08)}
    .nav-tab.active{
      color:#fff;
      background:linear-gradient(135deg, rgba(56,189,248,0.25), rgba(129,140,248,0.25));
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .nav-tab svg{width:13px;height:13px}

    .top-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
    .pill{
      font-size:12px;color:var(--muted);
      border:1px solid var(--border);
      padding:6px 12px;border-radius:999px;
      background:rgba(15,23,42,0.5);
      transition:all 0.2s;
    }
    .pill:hover{border-color:var(--border-strong);color:var(--text)}
    .btn{
      border:none;
      background:linear-gradient(135deg, #1e293b, #0f172a);
      color:var(--muted);
      padding:8px 14px;border-radius:var(--radius-sm);
      font-size:12px;font-weight:500;
      cursor:pointer;
      border:1px solid var(--border);
      transition:all 0.2s;
      display:flex;align-items:center;gap:6px;
    }
    .btn:hover{color:var(--text);border-color:var(--border-strong);background:linear-gradient(135deg, #334155, #1e293b)}
    .btn:active{transform:scale(0.97)}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    .chat{
      flex:1;overflow:auto;padding:20px 18px 14px;
      background:
        radial-gradient(ellipse 60% 30% at 50% 0%, rgba(56,189,248,0.04), transparent),
        rgba(15,23,42,0.25);
    }
    .chat::-webkit-scrollbar{width:6px}
    .chat::-webkit-scrollbar-track{background:transparent}
    .chat::-webkit-scrollbar-thumb{
      background:rgba(148,163,184,0.15);border-radius:3px;
    }
    .chat::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.3)}

    .dayline{
      text-align:center;color:var(--dim);font-size:11px;
      margin:10px 0 18px;position:relative;
    }
    .dayline::before,.dayline::after{
      content:'';position:absolute;top:50%;width:28%;height:1px;
      background:linear-gradient(90deg, transparent, rgba(148,163,184,0.2), transparent);
    }
    .dayline::before{left:0}
    .dayline::after{right:0}

    .msg{display:flex;gap:12px;margin:14px 0;align-items:flex-end;animation:msg-in 0.35s ease-out}
    @keyframes msg-in{
      from{opacity:0;transform:translateY(12px)}
      to{opacity:1;transform:translateY(0)}
    }
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){flex:1;min-width:0}
    .msg.user > div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end}

    .avatar{
      width:36px;height:36px;border-radius:11px;flex-shrink:0;
      background:rgba(30,41,59,0.8);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;font-weight:600;color:var(--muted);
      border:1px solid var(--border);
      transition:transform 0.2s;
    }
    .avatar.bot{
      background:linear-gradient(135deg, rgba(56,189,248,0.25), rgba(129,140,248,0.25));
      border-color:rgba(56,189,248,0.3);
      color:#e0f2fe;
      box-shadow:0 0 16px rgba(56,189,248,0.2);
    }
    .avatar.bot svg{width:18px;height:18px}
    .avatar.user{
      background:linear-gradient(135deg, rgba(244,114,182,0.2), rgba(168,85,247,0.2));
      border-color:rgba(244,114,182,0.25);
      color:#fce7f3;
    }
    .avatar:hover{transform:scale(1.05)}

    .bubble{
      max-width:min(720px, 78%);
      display:inline-block;
      border-radius:16px;
      padding:12px 16px;
      border:1px solid var(--border);
      background:rgba(22,33,56,0.7);
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap:break-word;
      color:var(--text);
      position:relative;
    }
    .msg:not(.user) .bubble{
      border-top-left-radius:4px;
    }
    .msg.user .bubble{
      background:linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color:#fff;
      border-color:transparent;
      border-top-right-radius:4px;
      box-shadow:0 8px 24px rgba(56,189,248,0.25);
    }

    .meta{font-size:11px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:6px}
    .msg.user .meta{color:rgba(255,255,255,0.7);flex-direction:row-reverse}

    details.progress{
      margin-top:10px;
      border:1px solid rgba(56,189,248,0.2);
      border-radius:var(--radius-md);
      padding:10px 12px;
      background:rgba(15,23,42,0.5);
    }
    details.progress summary{
      cursor:pointer;user-select:none;color:var(--muted);font-size:12px;
      display:flex;align-items:center;gap:8px;outline:none;
    }
    details.progress summary::before{
      content:'';width:8px;height:8px;border-radius:50%;
      background:var(--brand);box-shadow:0 0 8px rgba(56,189,248,0.5);
    }
    details.progress[open] summary::before{animation:pulse-dot 1.5s infinite}
    .progress ul{margin:10px 0 0 0;padding:0;list-style:none}
    .progress li{
      margin:4px 0;font-size:12px;color:#cbd5e1;
      padding:6px 10px;border-radius:6px;
      background:rgba(15,23,42,0.4);
      display:flex;align-items:center;gap:8px;
    }
    .progress li::before{
      content:'';width:6px;height:6px;border-radius:50%;
      flex-shrink:0;
    }
    .progress li:has(✅)::before{background:var(--success);box-shadow:0 0 6px rgba(16,185,129,0.5)}
    .progress li:has(⏳)::before{background:var(--brand);animation:pulse-dot 1.2s infinite}

    details.agent-reason{
      margin-top:10px;
      border:1px solid rgba(244,114,182,0.25);
      border-radius:var(--radius-md);
      padding:10px 12px;
      background:rgba(15,23,42,0.5);
      max-width:100%;
    }
    details.agent-reason summary{
      cursor:pointer;user-select:none;color:#e2e8f0;font-size:12px;font-weight:500;
      display:flex;align-items:center;gap:8px;outline:none;
    }
    details.agent-reason > .turn{
      margin:12px 0 0 0;padding:10px 12px;
      border-radius:var(--radius-sm);
      background:rgba(15,23,42,0.5);
      border:1px solid var(--border);
    }
    details.agent-reason .turn-header{
      font-size:12px;font-weight:600;color:var(--brand-3);
      margin-bottom:6px;display:flex;align-items:center;gap:6px;
    }
    details.agent-reason .turn-thought{
      font-size:11px;color:var(--muted);line-height:1.5;
      padding:6px 8px;border-radius:6px;
      background:rgba(56,189,248,0.06);
      border-left:2px solid rgba(56,189,248,0.4);
      margin-bottom:8px;
      max-height:120px;overflow-y:auto;
    }
    details.agent-reason .turn-action{
      font-size:11px;margin:4px 0 0 8px;
      padding:6px 8px;border-radius:6px;
      background:rgba(16,185,129,0.06);
      border-left:2px solid rgba(16,185,129,0.4);
    }
    details.agent-reason .action-tool{
      font-weight:500;color:var(--success);
    }
    details.agent-reason .action-args{
      color:var(--dim);margin-left:4px;word-break:break-all;
    }
    details.agent-reason .action-obs{
      color:var(--muted);margin-top:4px;line-height:1.4;
      max-height:80px;overflow-y:auto;
      font-size:10px;
    }

    .answer-images{margin-top:12px;display:flex;flex-direction:column;gap:10px}
    .answer-images img{
      display:block;max-width:min(100%, 600px);max-height:600px;width:auto;height:auto;
      border-radius:var(--radius-md);
      border:1px solid var(--border);
      box-shadow:0 12px 32px rgba(0,0,0,0.35);
      background:rgba(15,23,42,0.6);
      transition:transform 0.2s;
    }
    .answer-images img:hover{transform:scale(1.01)}
    .answer-images a{font-size:12px;color:var(--muted);text-decoration:none;word-break:break-all}

    .typing{display:inline-flex;gap:5px;align-items:center;padding:2px 0}
    .typing .dot{
      width:7px;height:7px;border-radius:50%;
      background:linear-gradient(135deg, var(--brand), var(--brand-2));
      animation:bounce 1.2s infinite ease-in-out;
      box-shadow:0 0 6px rgba(56,189,248,0.4);
    }
    .typing .dot:nth-child(2){animation-delay:.15s}
    .typing .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.5}
      40%{transform:translateY(-6px);opacity:1}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:14px 16px;
      background:linear-gradient(0deg, rgba(15,23,42,0.6), rgba(15,23,42,0.2));
    }
    .input-row{display:flex;gap:10px;align-items:flex-end}
    textarea{
      flex:1;resize:none;
      min-height:48px;max-height:160px;
      padding:12px 16px;
      border-radius:var(--radius-md);
      border:1px solid var(--border);
      outline:none;
      font-size:14px;line-height:1.5;
      background:rgba(15,23,42,0.6);
      color:var(--text);
      font-family:inherit;
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus{
      border-color:rgba(56,189,248,0.5);
      box-shadow:0 0 0 3px rgba(56,189,248,0.12), 0 0 24px rgba(56,189,248,0.08);
    }
    textarea::placeholder{color:var(--dim)}

    .send{
      width:52px;height:48px;flex-shrink:0;
      border:none;border-radius:var(--radius-md);
      cursor:pointer;
      background:linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#fff;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 16px rgba(56,189,248,0.35);
      transition:transform 0.15s, box-shadow 0.2s;
      position:relative;overflow:hidden;
    }
    .send svg{width:20px;height:20px}
    .send:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(56,189,248,0.5)}
    .send:active{transform:translateY(0) scale(0.96)}
    .send:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .send::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,0.2), transparent 40%);
      pointer-events:none;
    }

    .composer-footer{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:8px;padding:0 4px;
    }
    .hint{color:var(--dim);font-size:11px}
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      border:1px solid var(--border);
      padding:1px 6px;border-radius:5px;
      background:rgba(15,23,42,0.6);
      color:var(--muted);font-size:10px;
    }

    .empty-hints{
      display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;
    }
    .hint-chip{
      font-size:12px;padding:4px 10px;border-radius:999px;
      border:1px solid var(--border);background:rgba(15,23,42,0.4);
      color:var(--muted);cursor:pointer;transition:all 0.2s;
    }
    .hint-chip:hover{border-color:rgba(56,189,248,0.4);color:var(--brand);background:rgba(56,189,248,0.06)}

    @media (max-width:768px){
      body{padding:0}
      .app{height:100vh;border-radius:0;border:none;max-width:100%}
      .brand{min-width:0}
      .title span{display:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="title">
          <strong>掌柜智库·增强版</strong>
          <span><span class="dot-live"></span>在线 · 可查询知识库与联网信息</span>
        </div>
      </div>
      <div class="nav-tabs">
        <a class="nav-tab" href="import.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入
        </a>
        <a class="nav-tab" href="manage.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          管理
        </a>
        <a class="nav-tab active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          聊天
        </a>
      </div>
      <div class="top-actions">
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:var(--muted);padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(15,23,42,0.4);transition:all 0.2s;">
          <input type="checkbox" id="streamToggle" checked style="accent-color:#38bdf8;"> 流式
        </label>
        <button class="btn" id="btnClear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          清空
        </button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <path d="M8 10h.01M16 10h.01M9 15c1 1 2 2 3 2s2-1 3-2"/>
          </svg>
        </div>
        <div>
          <div class="bubble">你好，我是掌柜智库·增强版 🤖
我可以帮你检索知识库文档，也能联网搜索最新信息。试试直接提问吧~</div>
          <div class="meta">提示：可以问「如何使用万用表测量电压？」</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="agent-control" style="display:flex;align-items:center;padding:0 0 8px 0;">
        <label id="agentLabel" title="启用后将使用 ReAct Agent 进行多轮工具调用（知识库检索+联网搜索+实时价格+商品对比），控制台将输出完整推理日志" style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:var(--muted);padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:rgba(15,23,42,0.4);transition:all 0.2s;">
          <input type="checkbox" id="agentToggle" style="accent-color:#f472b6;"> 开启AI Agent智能体模式(ReAct多轮工具调用)
        </label>
      </div>
      <div class="input-row">
        <textarea id="input" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send" title="发送 (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="composer-footer">
        <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
        <div class="empty-hints">
          <span class="hint-chip" data-q="如何使用万用表测量电压？">如何使用万用表测量电压？</span>
          <span class="hint-chip" data-q="介绍一下欧姆定律">介绍一下欧姆定律</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (location.port === '8001' || location.hostname === 'localhost')
      ? `${location.protocol}//${location.hostname}:8001`
      : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];

      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const allImages = new Set([
          ...(imagesFromBlock.length ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => { img.style.display = 'none'; });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text, ts){
      const timeStr = ts ? formatTime(ts) : nowTime();
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${timeStr}</div>
          </div>
          <div class="avatar user">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const timeStr = ts ? formatTime(ts) : nowTime();
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4"/>
              <path d="M8 10h.01M16 10h.01M9 15c1 1 2 2 3 2s2-1 3-2"/>
            </svg>
          </div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${timeStr}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4"/>
              <path d="M8 10h.01M16 10h.01M9 15c1 1 2 2 3 2s2-1 3-2"/>
            </svg>
          </div>
          <div style="min-width: 200px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';
      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✅ ${x}`),
        ...running.map(x => `⏳ ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function renderAgentSteps(botMsgEl, steps){
      const bubble = botMsgEl.querySelector('.bubble');
      let panel = bubble.querySelector('details.agent-reason');

      const safeSteps = Array.isArray(steps) ? steps : [];
      if(safeSteps.length === 0) return;

      if(!panel){
        panel = document.createElement('details');
        panel.className = 'agent-reason';
        panel.innerHTML = '<summary>🔍 Agent推理链路（ReAct）</summary>';
        const firstEl = bubble.querySelector('.answer, details.progress');
        if(firstEl){
          bubble.insertBefore(panel, firstEl);
        }else{
          bubble.appendChild(panel);
        }
      }

      const existing = panel.querySelectorAll('.turn');
      const startFrom = existing.length;

      for(let i = startFrom; i < safeSteps.length; i++){
        const step = safeSteps[i];
        if(!step) continue;
        const turnEl = document.createElement('div');
        turnEl.className = 'turn';

        const headerHtml = `<div class="turn-header">🔄 第${step.turn || '?'}轮推理</div>`;

        let thoughtHtml = '';
        if(step.thought){
          const t = escapeHtml(String(step.thought).slice(0, 300));
          thoughtHtml = `<div class="turn-thought">💭 <b>Thought:</b> ${t}</div>`;
        }

        let actionsHtml = '';
        const actions = Array.isArray(step.actions) ? step.actions : [];
        for(const a of actions){
          if(!a) continue;
          const toolName = escapeHtml(String(a.tool || 'unknown'));
          const args = a.args ? escapeHtml(String(a.args).slice(0, 150)) : '';
          const obs = a.observation ? escapeHtml(String(a.observation).slice(0, 300)) : '';
          actionsHtml +=
            `<div class="turn-action">` +
            `🔧 <span class="action-tool">${toolName}</span>` +
            (args ? `<span class="action-args">(${args})</span>` : '') +
            (obs ? `<div class="action-obs">📋 <b>Observation:</b> ${obs}</div>` : '') +
            `</div>`;
        }

        turnEl.innerHTML = headerHtml + thoughtHtml + actionsHtml;
        panel.appendChild(turnEl);
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls, agentSteps){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open');
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);

      if(agentSteps && agentSteps.length > 0 && agentToggle.checked){
        renderAgentSteps(botMsgEl, agentSteps);
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsg(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const enableAgent = agentToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream,
          enable_agent: enableAgent
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){}
      }, 1200);
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);

        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          const agentSteps = Array.isArray(data.agent_steps) ? data.agent_steps : [];
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || [], agentSteps);
          sendBtn.disabled = false;
          return;
        }

        const { task_id } = data;

        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${task_id}`);
        let rawAnswerText = '';
        let agentStepsStream = [];

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('agent_step', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            if(d && d.step){
              agentStepsStream.push(d.step);
              if(agentToggle.checked){
                renderAgentSteps(botMsgEl, agentStepsStream);
              }
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        function handleFinalEvent(e) {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();

          const details = botMsgEl.querySelector('details.progress');
          if(details){
            const ul = details.querySelector('ul');
            if(ul){
              const lis = ul.querySelectorAll('li');
              lis.forEach(li => {
                if(li.textContent.includes('⏳')){
                  li.textContent = li.textContent.replace('⏳', '✅');
                }
              });
            }
            const summary = details.querySelector('summary');
            if(summary){
              const totalDone = details.querySelectorAll('li').length;
              summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
            }
            details.removeAttribute('open');
          }

          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        }

        es.addEventListener('final', handleFinalEvent);
        es.addEventListener('final_answer', handleFinalEvent);

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });

    document.querySelectorAll('.hint-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        inputEl.value = chip.dataset.q || chip.textContent;
        inputEl.focus();
        inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      });
    });

    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        alert('服务端清空失败，仅清空本地显示');
      }

      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
